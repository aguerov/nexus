[package]
name = "nexus-supervisor"
version = "0.1.0"
edition = "2021"
description = "NEXUS local service supervisor/orchestrator for Windows 11"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
windows-service = { version = "0.7", optional = true }

[features]
default = []
winservice = ["windows-service"]

[[bin]]
name = "nexus-supervisor"
path = "src/main.rs"
